name: APK derle
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - name: Proje dosyalarini olustur
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'KM_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.klavyemouse.shz"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.klavyemouse.shz"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("dev.rikka.shizuku:api:13.1.5")
              implementation("dev.rikka.shizuku:provider:13.1.5")
              implementation("org.lsposed.hiddenapibypass:hiddenapibypass:4.3")
          }
          KM_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'KM_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="Klavye Mouse Shizuku"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".MouseService"
                      android:exported="false"
                      android:label="Klavye Mouse Shizuku"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config"/>
                  </service>
                  <provider
                      android:name="rikka.shizuku.ShizukuProvider"
                      android:authorities="${applicationId}.shizuku"
                      android:enabled="true"
                      android:exported="true"
                      android:multiprocess="false"
                      android:permission="android.permission.INTERACT_ACROSS_USERS_FULL"/>
              </application>
          </manifest>
          KM_EOF
          mkdir -p app/src/main/java/com/klavyemouse/shz
          cat > app/src/main/java/com/klavyemouse/shz/KeyInjector.kt <<'KM_EOF'
          package com.klavyemouse.shz

          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.IBinder
          import android.os.SystemClock
          import android.view.InputDevice
          import android.view.InputEvent
          import android.view.KeyEvent
          import android.view.MotionEvent
          import org.lsposed.hiddenapibypass.HiddenApiBypass
          import rikka.shizuku.Shizuku
          import rikka.shizuku.ShizukuBinderWrapper
          import rikka.shizuku.SystemServiceHelper
          import java.lang.reflect.Method

          object KeyInjector {
              private var im: Any? = null
              private var inject: Method? = null

              /** null = hazir, aksi halde hata metni */
              fun init(): String? {
                  if (inject != null) return null
                  return try {
                      if (Build.VERSION.SDK_INT >= 28) HiddenApiBypass.addHiddenApiExemptions("L")
                      if (!Shizuku.pingBinder()) return "Shizuku çalışmıyor. Shizuku uygulamasını açıp başlat."
                      if (Shizuku.checkSelfPermission() != PackageManager.PERMISSION_GRANTED) return "Shizuku izni verilmedi."
                      val binder: IBinder = ShizukuBinderWrapper(SystemServiceHelper.getSystemService("input"))
                      val stub = Class.forName("android.hardware.input.IInputManager\$Stub")
                      im = stub.getMethod("asInterface", IBinder::class.java).invoke(null, binder)
                      val iface = Class.forName("android.hardware.input.IInputManager")
                      inject = iface.getMethod("injectInputEvent", InputEvent::class.java, Int::class.javaPrimitiveType)
                      null
                  } catch (e: Throwable) {
                      "Hata: " + e.toString()
                  }
              }

              fun key(code: Int, down: Boolean) {
                  if (init() != null) return
                  val now = SystemClock.uptimeMillis()
                  val ev = KeyEvent(
                      now, now,
                      if (down) KeyEvent.ACTION_DOWN else KeyEvent.ACTION_UP,
                      code, 0, 0, -1, 0, 0, InputDevice.SOURCE_KEYBOARD
                  )
                  try { inject?.invoke(im, ev, 0) } catch (_: Throwable) {}
              }

              private fun motion(action: Int, source: Int, x: Float, y: Float, dx: Float, dy: Float, buttons: Int) {
                  if (init() != null) return
                  val now = SystemClock.uptimeMillis()
                  val props = arrayOf(MotionEvent.PointerProperties().apply { id = 0; toolType = MotionEvent.TOOL_TYPE_MOUSE })
                  val coords = arrayOf(MotionEvent.PointerCoords().apply {
                      this.x = x; this.y = y
                      pressure = if (buttons != 0) 1f else 0f
                      setAxisValue(MotionEvent.AXIS_RELATIVE_X, dx)
                      setAxisValue(MotionEvent.AXIS_RELATIVE_Y, dy)
                  })
                  val ev = MotionEvent.obtain(now, now, action, 1, props, coords, 0, buttons, 1f, 1f, -1, 0, source, 0)
                  try { inject?.invoke(im, ev, 0) } catch (_: Throwable) {}
                  ev.recycle()
              }

              fun mouseRel(x: Float, y: Float, dx: Float, dy: Float) =
                  motion(MotionEvent.ACTION_MOVE, InputDevice.SOURCE_MOUSE_RELATIVE, x, y, dx, dy, 0)

              fun mouseAbs(x: Float, y: Float) =
                  motion(MotionEvent.ACTION_HOVER_MOVE, InputDevice.SOURCE_MOUSE, x, y, 0f, 0f, 0)

              fun mouseBtn(mask: Int, down: Boolean, x: Float, y: Float) =
                  motion(if (down) MotionEvent.ACTION_DOWN else MotionEvent.ACTION_UP, InputDevice.SOURCE_MOUSE, x, y, 0f, 0f, if (down) mask else 0)
          }
          KM_EOF
          mkdir -p app/src/main/java/com/klavyemouse/shz
          cat > app/src/main/java/com/klavyemouse/shz/MainActivity.kt <<'KM_EOF'
          package com.klavyemouse.shz

          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.KeyEvent
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import rikka.shizuku.Shizuku

          class MainActivity : Activity() {
              private lateinit var status: TextView
              private val handler = Handler(Looper.getMainLooper())

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val d = resources.displayMetrics.density
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding((20 * d).toInt(), (20 * d).toInt(), (20 * d).toInt(), (20 * d).toInt())
                  }
                  col.addView(TextView(this).apply {
                      text = "Klavye Mouse (Shizuku)\n\n1) Shizuku uygulamasını kur ve başlat.\n2) 'Shizuku izni iste'ye bas.\n3) 'Erişilebilirlik ayarlarını aç' ile bu uygulamayı etkinleştir.\n4) 'Tuş testi' ile gerçek tuşun gittiğini dene."
                      textSize = 15f
                  })
                  status = TextView(this).apply { textSize = 15f; setPadding(0, (12 * d).toInt(), 0, (12 * d).toInt()) }
                  col.addView(status)
                  fun btn(t: String, on: () -> Unit) = Button(this).apply { text = t; isAllCaps = false; setOnClickListener { on() } }
                  col.addView(btn("Shizuku izni iste") {
                      try {
                          if (!Shizuku.pingBinder()) status.text = "Shizuku çalışmıyor. Önce Shizuku uygulamasını aç ve başlat."
                          else Shizuku.requestPermission(1)
                      } catch (e: Throwable) { status.text = "Hata: $e" }
                      handler.postDelayed({ refresh() }, 1500)
                  })
                  col.addView(btn("Erişilebilirlik ayarlarını aç") { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) })
                  col.addView(btn("Tuş testi (5 sn sonra 'a' yazar)") {
                      val err = KeyInjector.init()
                      if (err != null) { status.text = err }
                      else {
                          status.text = "5 saniye içinde bir yazı kutusuna bas. 'aaa' yazılmalı."
                          for (i in 0 until 3) handler.postDelayed({
                              KeyInjector.key(KeyEvent.KEYCODE_A, true)
                              KeyInjector.key(KeyEvent.KEYCODE_A, false)
                          }, 5000L + i * 300L)
                      }
                  })
                  col.addView(btn("Durumu yenile") { refresh() })
                  val sv = ScrollView(this); sv.addView(col); setContentView(sv)
                  refresh()
              }

              override fun onResume() { super.onResume(); refresh() }

              private fun refresh() {
                  val run = try { Shizuku.pingBinder() } catch (_: Throwable) { false }
                  val perm = try { run && Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED } catch (_: Throwable) { false }
                  status.text = "Shizuku: " + (if (run) "çalışıyor ✓" else "çalışmıyor ✗") +
                      "\nİzin: " + (if (perm) "verildi ✓" else "yok ✗")
              }
          }
          KM_EOF
          mkdir -p app/src/main/java/com/klavyemouse/shz
          cat > app/src/main/java/com/klavyemouse/shz/MouseService.kt <<'KM_EOF'
          package com.klavyemouse.shz

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Context
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.os.Handler
          import android.os.Looper
          import android.util.DisplayMetrics
          import android.view.*
          import android.view.accessibility.AccessibilityEvent
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import kotlin.math.abs

          class MouseService : AccessibilityService() {
              private lateinit var wm: WindowManager
              private lateinit var ui: Context
              private var cursor: View? = null
              private var panel: LinearLayout? = null
              private lateinit var cursorLp: WindowManager.LayoutParams
              private lateinit var panelLp: WindowManager.LayoutParams
              private var cx = 300f
              private var cy = 600f
              private val handler = Handler(Looper.getMainLooper())

              // 0 = Kamera (dokunuşla bakma), 1 = Menü (imleç + dokunma), 2 = Fare (gerçek fare olayı)
              private var mode = 0
              private var sens = 0.5f

              // Kamera (surekli surukleme)
              private var lookX = 0f
              private var lookY = 0f
              private var lookCx = 0f
              private var lookCy = 0f
              private var pendDx = 0f
              private var pendDy = 0f
              private var lookActive = false
              private var lookBusy = false
              private var lookStroke: GestureDescription.StrokeDescription? = null

              // Basili tutma (vurma)
              private var holdActive = false
              private var holdStroke: GestureDescription.StrokeDescription? = null
              private var holdX = 0f
              private var holdY = 0f

              @Suppress("DEPRECATION")
              private fun screen(): IntArray {
                  val dm = DisplayMetrics()
                  wm.defaultDisplay.getRealMetrics(dm)
                  return intArrayOf(dm.widthPixels, dm.heightPixels)
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun lp(w: Int, h: Int, flags: Int) = WindowManager.LayoutParams(
                  w, h, WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY, flags, PixelFormat.TRANSLUCENT
              ).apply { gravity = Gravity.TOP or Gravity.START }

              override fun onServiceConnected() {
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  ui = ContextThemeWrapper(this, android.R.style.Theme_DeviceDefault)
                  addCursor()
                  addPanel()
                  cursor?.visibility = View.INVISIBLE
                  val err = KeyInjector.init()
                  Toast.makeText(this, err ?: "Gerçek tuş modu hazır ✓", Toast.LENGTH_LONG).show()
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onDestroy() {
                  try { cursor?.let { wm.removeViewImmediate(it) } } catch (_: Exception) {}
                  try { panel?.let { wm.removeViewImmediate(it) } } catch (_: Exception) {}
                  super.onDestroy()
              }

              private fun addCursor() {
                  val v = object : View(ui) {
                      override fun onDraw(c: Canvas) {
                          val p = Path().apply {
                              moveTo(0f, 0f); lineTo(0f, height * 0.85f); lineTo(width * 0.28f, height * 0.65f)
                              lineTo(width * 0.5f, height.toFloat()); lineTo(width * 0.65f, height * 0.92f)
                              lineTo(width * 0.45f, height * 0.58f); lineTo(width * 0.8f, height * 0.58f); close()
                          }
                          val f = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }
                          val s = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.BLACK; style = Paint.Style.STROKE; strokeWidth = 3f }
                          c.drawPath(p, f); c.drawPath(p, s)
                      }
                  }
                  cursorLp = lp(dp(26), dp(26),
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS)
                  cursorLp.x = cx.toInt(); cursorLp.y = cy.toInt()
                  wm.addView(v, cursorLp)
                  cursor = v
              }

              private fun moveCursor(dx: Float, dy: Float) {
                  val sc = screen()
                  cx = (cx + dx).coerceIn(0f, sc[0] - 1f)
                  cy = (cy + dy).coerceIn(0f, sc[1] - 1f)
                  cursorLp.x = cx.toInt(); cursorLp.y = cy.toInt()
                  cursor?.let { wm.updateViewLayout(it, cursorLp) }
              }

              private fun tapAt(x: Float, y: Float, dur: Long) {
                  val path = Path().apply { moveTo(x, y) }
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, dur)).build()
                  dispatchGesture(g, null, null)
              }

              private fun centerX() = screen()[0] / 2f
              private fun centerY() = screen()[1] / 2f

              // ---------- Kamera: surekli parmak surukleme ----------
              private fun dispatchLook(st: GestureDescription.StrokeDescription, after: (() -> Unit)? = null) {
                  lookBusy = true
                  dispatchGesture(GestureDescription.Builder().addStroke(st).build(), object : GestureResultCallback() {
                      override fun onCompleted(g: GestureDescription?) {
                          lookBusy = false
                          if (after != null) after() else lookPump()
                      }
                      override fun onCancelled(g: GestureDescription?) {
                          lookBusy = false
                          lookStroke = null
                          if (lookActive && !holdActive) handler.postDelayed({ if (lookActive && !holdActive) lookStart() }, 50)
                      }
                  }, null)
              }

              private fun lookStart() {
                  if (holdActive) return
                  val sc0 = screen()
                  lookX = sc0[0] * 0.72f; lookY = sc0[1] * 0.5f
                  lookCx = lookX; lookCy = lookY; pendDx = 0f; pendDy = 0f
                  val path = Path().apply { moveTo(lookCx, lookCy) }
                  val st = GestureDescription.StrokeDescription(path, 0, 20, true)
                  lookStroke = st
                  dispatchLook(st)
              }

              private fun lookPump() {
                  if (!lookActive || lookBusy || holdActive) return
                  val prev = lookStroke ?: return
                  val sc = screen()
                  val nx = lookCx + pendDx
                  val ny = lookCy + pendDy
                  pendDx = 0f; pendDy = 0f
                  val out = nx < sc[0] * 0.4f || nx > sc[0] - dp(10) || ny < dp(40) || ny > sc[1] - dp(10)
                  if (out) {
                      val path = Path().apply { moveTo(lookCx, lookCy) }
                      val st = prev.continueStroke(path, 0, 20, false)
                      lookStroke = null
                      dispatchLook(st) { if (lookActive) lookStart() }
                      return
                  }
                  val path = Path().apply {
                      moveTo(lookCx, lookCy)
                      if (nx != lookCx || ny != lookCy) lineTo(nx, ny)
                  }
                  val st = prev.continueStroke(path, 0, 25, true)
                  lookCx = nx; lookCy = ny
                  lookStroke = st
                  dispatchLook(st)
              }

              private fun lookEnd() {
                  lookActive = false
                  val prev = lookStroke
                  lookStroke = null
                  if (prev != null) {
                      val path = Path().apply { moveTo(lookCx, lookCy) }
                      val st = prev.continueStroke(path, 0, 20, false)
                      dispatchGesture(GestureDescription.Builder().addStroke(st).build(), null, null)
                  }
              }

              // ---------- Basili tutma (blok kirma) ----------
              private fun holdSend(s: GestureDescription.StrokeDescription) {
                  dispatchGesture(GestureDescription.Builder().addStroke(s).build(), object : GestureResultCallback() {
                      override fun onCompleted(g: GestureDescription?) {
                          if (holdActive) {
                              val n = s.continueStroke(Path().apply { moveTo(holdX, holdY) }, 0, 60, true)
                              holdStroke = n
                              holdSend(n)
                          }
                      }
                      override fun onCancelled(g: GestureDescription?) { holdStroke = null }
                  }, null)
              }

              private fun holdStart(x: Float, y: Float) {
                  lookActive = false; lookStroke = null
                  holdX = x; holdY = y; holdActive = true
                  val s = GestureDescription.StrokeDescription(Path().apply { moveTo(x, y) }, 0, 60, true)
                  holdStroke = s
                  holdSend(s)
              }

              private fun holdStop() {
                  holdActive = false
                  val prev = holdStroke
                  holdStroke = null
                  if (prev != null) {
                      val st = prev.continueStroke(Path().apply { moveTo(holdX, holdY) }, 0, 20, false)
                      dispatchGesture(GestureDescription.Builder().addStroke(st).build(), null, null)
                  }
              }

              private fun click() {
                  KeyInjector.mouseBtn(1, true, cx, cy)
                  handler.postDelayed({ KeyInjector.mouseBtn(1, false, cx, cy) }, 50)
              }

              // ---------- Arayuz ----------
              private fun btn(label: String, w: Float = 1f, h: Int = 36, onClick: () -> Unit) = Button(ui).apply {
                  text = label; textSize = 12f; isAllCaps = false
                  setPadding(0, 0, 0, 0); minWidth = 0; minimumWidth = 0; minHeight = 0; minimumHeight = 0
                  layoutParams = LinearLayout.LayoutParams(0, dp(h), w).apply { setMargins(dp(1), dp(1), dp(1), dp(1)) }
                  setOnClickListener { onClick() }
              }

              private fun keyBtn(label: String, code: Int, w: Float = 1f) = btn(label, w, 40) {}.apply {
                  setOnTouchListener { v, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { v.isPressed = true; KeyInjector.key(code, true) }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> { v.isPressed = false; KeyInjector.key(code, false) }
                      }
                      true
                  }
              }

              /** Vur (sol): basili tut. Koy (sag): dokun. Moda gore dokunus ya da gercek fare. */
              private fun mouseHold(label: String, left: Boolean, w: Float = 1f) = btn(label, w, 40) {}.apply {
                  setOnTouchListener { v, e ->
                      val px = if (mode == 1) cx else centerX()
                      val py = if (mode == 1) cy else centerY()
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              v.isPressed = true
                              if (mode == 2) KeyInjector.mouseBtn(if (left) 1 else 2, true, cx, cy)
                              else if (left) holdStart(px, py)
                              else tapAt(px, py, 60)
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              v.isPressed = false
                              if (mode == 2) KeyInjector.mouseBtn(if (left) 1 else 2, false, cx, cy)
                              else if (left) holdStop()
                          }
                      }
                      true
                  }
              }

              private fun row(vararg v: View) = LinearLayout(ui).apply {
                  orientation = LinearLayout.HORIZONTAL
                  v.forEach { addView(it) }
              }

              private fun addPanel() {
                  val p = LinearLayout(ui).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(6), dp(6), dp(6), dp(6))
                      background = GradientDrawable().apply { setColor(0xE6222222.toInt()); cornerRadius = dp(12).toFloat() }
                  }
                  panelLp = lp(dp(300), WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                      WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS)
                  panelLp.x = dp(20); panelLp.y = dp(80)

                  val title = TextView(ui).apply {
                      text = "✥ Klavye Mouse"; setTextColor(Color.WHITE); textSize = 13f
                      gravity = Gravity.CENTER_VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, dp(36), 1f)
                  }
                  var ox = 0f; var oy = 0f; var sx = 0; var sy = 0
                  title.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { ox = e.rawX; oy = e.rawY; sx = panelLp.x; sy = panelLp.y }
                          MotionEvent.ACTION_MOVE -> {
                              panelLp.x = sx + (e.rawX - ox).toInt(); panelLp.y = sy + (e.rawY - oy).toInt()
                              wm.updateViewLayout(p, panelLp)
                          }
                      }
                      true
                  }
                  val bar = row(title, btn("✕", 0.5f) { disableSelf() })

                  val pad = View(ui).apply {
                      background = GradientDrawable().apply { setColor(0xFF3A3A3A.toInt()); cornerRadius = dp(8).toFloat() }
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, dp(90))
                          .apply { setMargins(dp(1), dp(3), dp(1), dp(3)) }
                  }
                  var lx = 0f; var ly = 0f; var moved = 0f; var t0 = 0L
                  pad.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              lx = e.rawX; ly = e.rawY; moved = 0f; t0 = e.eventTime
                              if (mode == 0) { lookActive = true; lookStart() }
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - lx; val dy = e.rawY - ly
                              lx = e.rawX; ly = e.rawY; moved += abs(dx) + abs(dy)
                              when (mode) {
                                  0 -> { pendDx += dx * sens; pendDy += dy * sens; lookPump() }
                                  1 -> moveCursor(dx * 2f, dy * 2f)
                                  else -> KeyInjector.mouseRel(cx, cy, dx * 1.5f, dy * 1.5f)
                              }
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              if (mode == 0) lookEnd()
                              else if (mode == 1 && moved < dp(8) && e.eventTime - t0 < 200) tapAt(cx, cy, 50)
                          }
                      }
                      true
                  }

                  lateinit var modeBtn: Button
                  modeBtn = btn("Mod: Kamera", 1.5f, 40) {
                      mode = (mode + 1) % 3
                      modeBtn.text = when (mode) { 0 -> "Mod: Kamera"; 1 -> "Mod: Menü"; else -> "Mod: Fare" }
                      cursor?.visibility = if (mode == 1) View.VISIBLE else View.INVISIBLE
                  }
                  val clicks = row(modeBtn, mouseHold("Vur", true), mouseHold("Koy", false), btn("Tık", 1f, 40) {
                      when (mode) { 2 -> click(); 1 -> tapAt(cx, cy, 50); else -> tapAt(centerX(), centerY(), 50) }
                  })

                  val wasd = row(
                      keyBtn("W", KeyEvent.KEYCODE_W), keyBtn("A", KeyEvent.KEYCODE_A),
                      keyBtn("S", KeyEvent.KEYCODE_S), keyBtn("D", KeyEvent.KEYCODE_D)
                  )
                  val keys2 = row(
                      keyBtn("Boşluk", KeyEvent.KEYCODE_SPACE, 1.6f), keyBtn("Shift", KeyEvent.KEYCODE_SHIFT_LEFT, 1.2f),
                      keyBtn("Ctrl", KeyEvent.KEYCODE_CTRL_LEFT, 1.1f), keyBtn("E", KeyEvent.KEYCODE_E)
                  )
                  val keys3 = row(
                      keyBtn("Q", KeyEvent.KEYCODE_Q), keyBtn("F", KeyEvent.KEYCODE_F),
                      keyBtn("T", KeyEvent.KEYCODE_T), keyBtn("Esc", KeyEvent.KEYCODE_ESCAPE, 1.2f)
                  )
                  val nums = row(*(1..9).map { n -> keyBtn(n.toString(), KeyEvent.KEYCODE_1 + (n - 1)) }.toTypedArray())

                  lateinit var spd: Button
                  spd = btn("Hız: " + String.format("%.2f", sens), 1.4f, 34) {}
                  val sensRow = row(
                      btn("Hız −", 1f, 34) { sens = (sens / 1.4f).coerceAtLeast(0.05f); spd.text = "Hız: " + String.format("%.2f", sens) },
                      spd,
                      btn("Hız +", 1f, 34) { sens = (sens * 1.4f).coerceAtMost(4f); spd.text = "Hız: " + String.format("%.2f", sens) }
                  )
                  p.addView(bar); p.addView(pad); p.addView(clicks); p.addView(sensRow)
                  p.addView(wasd); p.addView(keys2); p.addView(keys3); p.addView(nums)
                  wm.addView(p, panelLp)
                  panel = p
              }
          }
