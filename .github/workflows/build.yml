name: APK derle
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2
      - name: Proje dosyalarini olustur
        run: |
          mkdir -p app
          cat > app/build.gradle.kts <<'KM_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.klavyemouse.bt"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.klavyemouse.bt"
                  minSdk = 28
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          KM_EOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'KM_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-feature android:name="android.hardware.bluetooth" android:required="true"/>
              <application
                  android:label="Klavye Mouse BT"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          KM_EOF
          mkdir -p app/src/main/java/com/klavyemouse/bt
          cat > app/src/main/java/com/klavyemouse/bt/MainActivity.kt <<'KM_EOF'
          package com.klavyemouse.bt

          import android.Manifest
          import android.annotation.SuppressLint
          import android.app.Activity
          import android.bluetooth.BluetoothAdapter
          import android.bluetooth.BluetoothDevice
          import android.bluetooth.BluetoothHidDevice
          import android.bluetooth.BluetoothHidDeviceAppSdpSettings
          import android.bluetooth.BluetoothManager
          import android.bluetooth.BluetoothProfile
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import kotlin.math.abs

          @SuppressLint("MissingPermission", "ClickableViewAccessibility")
          class MainActivity : Activity() {

              companion object {
                  private const val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
                  // Klavye (rapor 1) + Mouse (rapor 2) HID tanimlayicisi
                  val DESC: ByteArray = intArrayOf(
                      0x05, 0x01, 0x09, 0x06, 0xA1, 0x01, 0x85, 0x01,
                      0x05, 0x07, 0x19, 0xE0, 0x29, 0xE7, 0x15, 0x00, 0x25, 0x01, 0x75, 0x01, 0x95, 0x08, 0x81, 0x02,
                      0x95, 0x01, 0x75, 0x08, 0x81, 0x01,
                      0x95, 0x06, 0x75, 0x08, 0x15, 0x00, 0x25, 0x65, 0x05, 0x07, 0x19, 0x00, 0x29, 0x65, 0x81, 0x00,
                      0xC0,
                      0x05, 0x01, 0x09, 0x02, 0xA1, 0x01, 0x85, 0x02, 0x09, 0x01, 0xA1, 0x00,
                      0x05, 0x09, 0x19, 0x01, 0x29, 0x03, 0x15, 0x00, 0x25, 0x01, 0x95, 0x03, 0x75, 0x01, 0x81, 0x02,
                      0x95, 0x01, 0x75, 0x05, 0x81, 0x01,
                      0x05, 0x01, 0x09, 0x30, 0x09, 0x31, 0x09, 0x38, 0x15, 0x81, 0x25, 0x7F, 0x75, 0x08, 0x95, 0x03, 0x81, 0x06,
                      0xC0, 0xC0
                  ).map { it.toByte() }.toByteArray()
              }

              private var adapter: BluetoothAdapter? = null
              private var hid: BluetoothHidDevice? = null
              private var host: BluetoothDevice? = null
              private val handler = Handler(Looper.getMainLooper())
              private lateinit var root: FrameLayout
              private var statusTv: TextView? = null
              private var listBox: LinearLayout? = null
              private val pressed = ArrayList<Int>()
              private var mods = 0
              private var mbtn = 0

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  root = FrameLayout(this)
                  root.setBackgroundColor(0xFF111111.toInt())
                  setContentView(root)
                  showConnect()
                  if (Build.VERSION.SDK_INT >= 31 &&
                      checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.BLUETOOTH_CONNECT), 1)
                  } else {
                      initBt()
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (grantResults.isNotEmpty() && grantResults[0] == PackageManager.PERMISSION_GRANTED) initBt()
                  else setStatus("Bluetooth izni verilmedi. Uygulamayı kapatıp tekrar aç ve izin ver.")
              }

              override fun onResume() {
                  super.onResume()
                  if (host == null) refreshList()
              }

              override fun onDestroy() {
                  try { hid?.unregisterApp() } catch (_: Exception) {}
                  try { adapter?.closeProfileProxy(BluetoothProfile.HID_DEVICE, hid) } catch (_: Exception) {}
                  super.onDestroy()
              }

              private val cb = object : BluetoothHidDevice.Callback() {
                  override fun onAppStatusChanged(pluggedDevice: BluetoothDevice?, registered: Boolean) {
                      setStatus(
                          if (registered) "Hazır. Aşağıdan tableti seçip bağlan."
                          else "Kayıt başarısız. Bu telefon Bluetooth klavye modunu desteklemiyor olabilir."
                      )
                  }

                  override fun onConnectionStateChanged(device: BluetoothDevice, state: Int) {
                      runOnUiThread {
                          if (state == BluetoothProfile.STATE_CONNECTED) {
                              host = device
                              showController()
                          } else if (state == BluetoothProfile.STATE_DISCONNECTED) {
                              if (host == device) {
                                  host = null
                                  pressed.clear(); mods = 0; mbtn = 0
                                  showConnect()
                                  setStatus("Bağlantı koptu.")
                              }
                          }
                      }
                  }
              }

              private fun initBt() {
                  val a = (getSystemService(BLUETOOTH_SERVICE) as BluetoothManager).adapter
                  adapter = a
                  if (a == null) { setStatus("Bu cihazda Bluetooth yok."); return }
                  if (!a.isEnabled) { setStatus("Önce Bluetooth'u aç, sonra uygulamayı yeniden başlat."); return }
                  val ok = a.getProfileProxy(this, object : BluetoothProfile.ServiceListener {
                      override fun onServiceConnected(profile: Int, proxy: BluetoothProfile) {
                          if (profile == BluetoothProfile.HID_DEVICE) {
                              val p = proxy as BluetoothHidDevice
                              hid = p
                              val sdp = BluetoothHidDeviceAppSdpSettings(
                                  "Klavye Mouse", "Klavye ve Mouse", "KM",
                                  BluetoothHidDevice.SUBCLASS1_COMBO, DESC
                              )
                              val reg = p.registerApp(sdp, null, null, mainExecutor, cb)
                              if (!reg) setStatus("Kayıt başarısız. Bu telefon desteklemiyor olabilir.")
                          }
                      }

                      override fun onServiceDisconnected(profile: Int) {
                          if (profile == BluetoothProfile.HID_DEVICE) hid = null
                      }
                  }, BluetoothProfile.HID_DEVICE)
                  if (!ok) setStatus("Bu telefon Bluetooth klavye modunu desteklemiyor.")
                  refreshList()
              }

              private fun setStatus(t: String) { runOnUiThread { statusTv?.text = t } }

              private fun tv(t: String, size: Float = 15f, bold: Boolean = false) = TextView(this).apply {
                  text = t; textSize = size; setTextColor(Color.WHITE)
                  if (bold) setTypeface(typeface, android.graphics.Typeface.BOLD)
                  setPadding(0, dp(6), 0, dp(6))
              }

              private fun btn(t: String, on: () -> Unit) = Button(this).apply {
                  text = t; isAllCaps = false
                  setOnClickListener { on() }
              }

              private fun showConnect() {
                  root.removeAllViews()
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(16), dp(20), dp(16))
                  }
                  col.addView(tv("Klavye Mouse BT", 22f, true))
                  statusTv = tv("Hazırlanıyor...")
                  col.addView(statusTv)
                  col.addView(tv(
                      "Bu telefon, oyun oynayacağın tablete Bluetooth klavye ve mouse olur.\n" +
                      "1) Aşağıdaki 'Telefonu görünür yap' düğmesine bas.\n" +
                      "2) TABLETTE Bluetooth ayarlarını aç, bu telefonu bulup eşleştir.\n" +
                      "3) Buraya dönüp 'Listeyi yenile' de, listeden tableti seç."
                  ))
                  col.addView(btn("Telefonu görünür yap") {
                      startActivity(Intent(BluetoothAdapter.ACTION_REQUEST_DISCOVERABLE)
                          .putExtra(BluetoothAdapter.EXTRA_DISCOVERABLE_DURATION, 300))
                  })
                  col.addView(btn("Bluetooth ayarlarını aç") { startActivity(Intent(Settings.ACTION_BLUETOOTH_SETTINGS)) })
                  col.addView(btn("Listeyi yenile") { refreshList() })
                  listBox = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  col.addView(listBox)
                  val sv = ScrollView(this)
                  sv.addView(col)
                  root.addView(sv)
                  refreshList()
              }

              private fun refreshList() {
                  val box = listBox ?: return
                  box.removeAllViews()
                  val devs = try { adapter?.bondedDevices } catch (_: Exception) { null }
                  if (devs.isNullOrEmpty()) {
                      box.addView(tv("Eşleşmiş cihaz yok. Önce tabletle eşleştir."))
                      return
                  }
                  devs.forEach { d ->
                      box.addView(btn("Bağlan: " + (d.name ?: d.address)) {
                          setStatus("Bağlanıyor: " + (d.name ?: d.address))
                          hid?.connect(d)
                      })
                  }
              }

              // ---- HID rapor gonderme ----
              private fun sendKb() {
                  val d = host ?: return
                  val data = ByteArray(8)
                  data[0] = mods.toByte()
                  for (i in 0 until minOf(6, pressed.size)) data[2 + i] = pressed[i].toByte()
                  hid?.sendReport(d, 1, data)
              }

              private fun sendMouse(dx: Int, dy: Int, wheel: Int) {
                  val d = host ?: return
                  hid?.sendReport(d, 2, byteArrayOf(mbtn.toByte(), dx.toByte(), dy.toByte(), wheel.toByte()))
              }

              private fun moveMouse(x: Int, y: Int) {
                  var rx = x; var ry = y
                  while (rx != 0 || ry != 0) {
                      val sx = rx.coerceIn(-127, 127); val sy = ry.coerceIn(-127, 127)
                      sendMouse(sx, sy, 0)
                      rx -= sx; ry -= sy
                  }
              }

              private fun press(usage: Int, mod: Int) {
                  if (mod != 0) mods = mods or mod
                  else if (usage !in pressed && pressed.size < 6) pressed.add(usage)
                  sendKb()
              }

              private fun release(usage: Int, mod: Int) {
                  if (mod != 0) mods = mods and mod.inv()
                  else pressed.remove(usage)
                  sendKb()
              }

              // ---- Kontrol ekrani ----
              private fun key(label: String, usage: Int = 0, mod: Int = 0, w: Float = 1f) = Button(this).apply {
                  text = label; isAllCaps = false; textSize = 14f
                  setPadding(0, 0, 0, 0); minWidth = 0; minimumWidth = 0
                  layoutParams = LinearLayout.LayoutParams(0, MATCH, w).apply { setMargins(dp(2), dp(2), dp(2), dp(2)) }
                  setOnTouchListener { v, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> { v.isPressed = true; press(usage, mod) }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> { v.isPressed = false; release(usage, mod) }
                      }
                      true
                  }
              }

              private fun letter(c: Char) = key(c.uppercase(), 4 + (c - 'a'))

              private fun mouseBtn(label: String, bit: Int, w: Float = 1f) = Button(this).apply {
                  text = label; isAllCaps = false; textSize = 13f
                  setPadding(0, 0, 0, 0); minWidth = 0; minimumWidth = 0
                  layoutParams = LinearLayout.LayoutParams(0, MATCH, w).apply { setMargins(dp(2), dp(2), dp(2), dp(2)) }
                  setOnTouchListener { v, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> { v.isPressed = true; mbtn = mbtn or bit; sendMouse(0, 0, 0) }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> { v.isPressed = false; mbtn = mbtn and bit.inv(); sendMouse(0, 0, 0) }
                      }
                      true
                  }
              }

              private fun wheelBtn(label: String, dir: Int) = Button(this).apply {
                  text = label; isAllCaps = false
                  setPadding(0, 0, 0, 0); minWidth = 0; minimumWidth = 0
                  layoutParams = LinearLayout.LayoutParams(0, MATCH, 0.6f).apply { setMargins(dp(2), dp(2), dp(2), dp(2)) }
                  setOnClickListener { sendMouse(0, 0, dir) }
              }

              private fun showController() {
                  root.removeAllViews()
                  val main = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(dp(6), dp(6), dp(6), dp(6))
                  }
                  val left = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  val right = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  main.addView(left, LinearLayout.LayoutParams(0, MATCH, 1.2f))
                  main.addView(right, LinearLayout.LayoutParams(0, MATCH, 1f))

                  fun addRow(vararg v: View) {
                      val r = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      v.forEach { r.addView(it) }
                      left.addView(r, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  }
                  val digits = (1..9).map { key(it.toString(), 0x1E + (it - 1)) }.toTypedArray()
                  addRow(key("Esc", 0x29, w = 1.4f), *digits)
                  addRow(letter('q'), letter('w'), letter('e'), letter('r'), letter('t'), letter('f'))
                  addRow(key("Shift", mod = 0x02, w = 1.5f), letter('a'), letter('s'), letter('d'), key("Ctrl", mod = 0x01, w = 1.3f))
                  addRow(key("Boşluk", 0x2C, w = 3f), key("Enter", 0x28, w = 1.5f), key("Tab", 0x2B, w = 1f), letter('c'), letter('x'))

                  val pad = View(this).apply {
                      background = GradientDrawable().apply { setColor(0xFF2A2A2A.toInt()); cornerRadius = dp(10).toFloat() }
                  }
                  var lx = 0f; var ly = 0f; var ax = 0f; var ay = 0f; var moved = 0f; var t0 = 0L
                  pad.setOnTouchListener { _, e ->
                      when (e.actionMasked) {
                          MotionEvent.ACTION_DOWN -> { lx = e.x; ly = e.y; moved = 0f; t0 = e.eventTime }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.x - lx) * 1.8f; val dy = (e.y - ly) * 1.8f
                              lx = e.x; ly = e.y
                              moved += abs(dx) + abs(dy)
                              ax += dx; ay += dy
                              val ix = ax.toInt(); val iy = ay.toInt()
                              ax -= ix; ay -= iy
                              moveMouse(ix, iy)
                          }
                          MotionEvent.ACTION_UP -> {
                              if (moved < dp(14) && e.eventTime - t0 < 220) {
                                  mbtn = mbtn or 1; sendMouse(0, 0, 0)
                                  handler.postDelayed({ mbtn = mbtn and 1.inv(); sendMouse(0, 0, 0) }, 40)
                              }
                          }
                      }
                      true
                  }
                  right.addView(pad, LinearLayout.LayoutParams(MATCH, 0, 2.2f))
                  val br = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  br.addView(mouseBtn("Sol (vur)", 1, 1.3f))
                  br.addView(mouseBtn("Sağ (koy)", 2, 1.3f))
                  br.addView(wheelBtn("▲", 1))
                  br.addView(wheelBtn("▼", -1))
                  right.addView(br, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  val kes = btn("Bağlantıyı kes") { host?.let { hid?.disconnect(it) } }
                  right.addView(kes, LinearLayout.LayoutParams(MATCH, 0, 0.7f))
                  root.addView(main)
              }
          }
          KM_EOF
          cat > build.gradle.kts <<'KM_EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          KM_EOF
          cat > gradle.properties <<'KM_EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.nonTransitiveRClass=true
          KM_EOF
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties <<'KM_EOF'
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          KM_EOF
          cat > settings.gradle.kts <<'KM_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "KlavyeMouseBT"
          include(":app")
          KM_EOF
      - name: Derle
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Klavye-Mouse-APK
          path: app/build/outputs/apk/debug/app-debug.apk
